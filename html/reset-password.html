<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Reset Password - Mini-Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="main.css" type="text/css"/>
    <link rel="stylesheet" href="reset-password.css" type="text/css"/>
    <script src="reset-password.js"></script>
</head>
<body>
    <body-content id="reset-page">
        <header>
            <header-text>Mini-Notes</header-text>
        </header>
        <reset-area>
            <reset-form>
                <input type="hidden" id="reset-user-id">
                <input type="hidden" id="reset-token">
                <label for="new-password-entry">New Password:</label>
                <input type="password" id="new-password-entry">
                <inline-alert id="reset-alert" role="alert"></inline-alert>
                <button id="reset-submit-btn">Set Password</button>
            </reset-form>
        </reset-area>
    </body-content>
</body>
</html>
